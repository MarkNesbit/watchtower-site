name: Upload Cloudflare Worker preview

on:
  workflow_dispatch:
    inputs:
      preview_alias:
        description: Optional stable alias for the preview URL. Defaults to the selected branch name.
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Build and upload non-production Worker version
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment: cloudflare-preview

    env:
      WATCHTOWER_PREVIEW_SUPABASE_URL: ${{ vars.WATCHTOWER_PREVIEW_SUPABASE_URL }}
      WATCHTOWER_PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WATCHTOWER_PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
      WATCHTOWER_PREVIEW_RESEND_API_KEY: ${{ secrets.WATCHTOWER_PREVIEW_RESEND_API_KEY }}
      WATCHTOWER_PREVIEW_ORIGIN: ${{ vars.WATCHTOWER_PREVIEW_ORIGIN }}
      WATCHTOWER_PREVIEW_WORKER_NAME: ${{ vars.WATCHTOWER_PREVIEW_WORKER_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHTOWER_PREVIEW_ALIAS: ${{ inputs.preview_alias || vars.WATCHTOWER_PREVIEW_ALIAS }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Environment variables are not automatically masked in Actions logs. Read
      # this value from the already-selected GitHub Environment, mask it, then
      # make it available to the upload step without changing where it is stored.
      - name: Load masked Preview anon key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          preview_anon_key="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/environments/cloudflare-preview/variables/WATCHTOWER_PREVIEW_SUPABASE_ANON_KEY" \
            --jq .value)"
          printf '::add-mask::%s\n' "$preview_anon_key"
          printf 'WATCHTOWER_PREVIEW_SUPABASE_ANON_KEY=%s\n' "$preview_anon_key" >> "$GITHUB_ENV"

      - name: Verify Preview configuration presence
        env:
          PREVIEW_SUPABASE_URL_PRESENT: ${{ vars.WATCHTOWER_PREVIEW_SUPABASE_URL != '' }}
          PREVIEW_SUPABASE_ANON_KEY_PRESENT: ${{ vars.WATCHTOWER_PREVIEW_SUPABASE_ANON_KEY != '' }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY_PRESENT: ${{ secrets.WATCHTOWER_PREVIEW_SUPABASE_SERVICE_ROLE_KEY != '' }}
          PREVIEW_ORIGIN_PRESENT: ${{ vars.WATCHTOWER_PREVIEW_ORIGIN != '' }}
          PREVIEW_WORKER_NAME_PRESENT: ${{ vars.WATCHTOWER_PREVIEW_WORKER_NAME != '' }}
          PREVIEW_ALIAS_PRESENT: ${{ inputs.preview_alias != '' || vars.WATCHTOWER_PREVIEW_ALIAS != '' }}
          CLOUDFLARE_ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CLOUDFLARE_API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=0
          check() {
            if [ "$2" = "true" ]; then
              printf '%s=PRESENT\n' "$1"
            else
              printf '%s=MISSING\n' "$1"
              missing=1
            fi
          }
          check WATCHTOWER_PREVIEW_SUPABASE_URL "$PREVIEW_SUPABASE_URL_PRESENT"
          check WATCHTOWER_PREVIEW_SUPABASE_ANON_KEY "$PREVIEW_SUPABASE_ANON_KEY_PRESENT"
          check WATCHTOWER_PREVIEW_SUPABASE_SERVICE_ROLE_KEY "$PREVIEW_SUPABASE_SERVICE_ROLE_KEY_PRESENT"
          check WATCHTOWER_PREVIEW_ORIGIN "$PREVIEW_ORIGIN_PRESENT"
          check WATCHTOWER_PREVIEW_WORKER_NAME "$PREVIEW_WORKER_NAME_PRESENT"
          check WATCHTOWER_PREVIEW_ALIAS "$PREVIEW_ALIAS_PRESENT"
          check CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID_PRESENT"
          check CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN_PRESENT"
          exit "$missing"

      - name: Build and upload preview version
        run: npm run deploy:preview
