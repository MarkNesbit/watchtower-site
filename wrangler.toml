name = "watchtower-site"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-06-17"
# Worker preview URLs are intentionally enabled for `wrangler versions upload`.
# A preview version is not routed to the production custom domain until an
# explicit `wrangler versions deploy` or `wrangler deploy` action occurs.
preview_urls = true

[vars]
PUBLIC_SUPABASE_URL = "https://wwxauzcgqtrqjyyskqzp.supabase.co"
WATCHTOWER_EMAIL_PROVIDER = "resend"
WATCHTOWER_EMAIL_FROM_ADDRESS = "invitations@watch-tower.co.uk"
WATCHTOWER_EMAIL_FROM_NAME = "Watchtower"
WATCHTOWER_INVITATION_REPLY_TO = "mark.nesbit.professional@gmail.com"
WATCHTOWER_SITE_URL = "https://watch-tower.co.uk"

[assets]
directory = "./dist"
binding = "ASSETS"
